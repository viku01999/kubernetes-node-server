apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-node-server
  namespace: staging
  labels:
    app: kubernetes-node-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-node-server
  template:
    metadata:
      labels:
        app: kubernetes-node-server
    spec:
      containers:
        - name: kubernetes-node-server
          image: viku01999/kubernetes-node-server:2.0
          ports:
            - containerPort: 3000
