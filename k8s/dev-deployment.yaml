# volume mount
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-node-server
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-node-server
  template:
    metadata:
      labels:
        app: kubernetes-node-server
    spec:
      containers:
        - name: kubernetes-node-server
          image: viku01999/kubernetes-node-server:3.0

          # 🔹 Resource requests & limits
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # 🔹 Mount ConfigMap and Secret
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
            - name: secret-volume
              mountPath: /app/secret

      # 🔹 Define volumes
      volumes:
        - name: config-volume
          configMap:
            name: node-app-config

        - name: secret-volume
          secret:
            secretName: node-app-secret
