# ==========================
# Deployment for your Node.js App
# ==========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-node-server    # ✅ Deployment name; must be unique in namespace
  labels:
    app: kubernetes-node-server   # ✅ Label used to identify pods; should match service selector
spec:
  replicas: 2                     # Number of pod replicas
  selector:
    matchLabels:
      app: kubernetes-node-server # ✅ Must match template.metadata.labels for service to select pods
  template:
    metadata:
      labels:
        app: kubernetes-node-server # ✅ Must match selector.matchLabels
    spec:
      containers:
        - name: kubernetes-node-server    # Name of the container
          image: viku01999/kubernetes-node-server:2.0 # Docker image (tag can change)
          ports:
            - containerPort: 3000        # ✅ Port your app listens inside the container (targetPort)
