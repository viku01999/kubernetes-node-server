# ==========================
# Service for NodePort Access
# ==========================
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-node-service      # ✅ Must be unique in namespace
spec:
  type: NodePort                      # Exposes service outside the cluster via a port on all nodes
  selector:
    app: kubernetes-node-server       # ✅ Must match deployment labels to select the right pods
  ports:
    - port: 3000        # ✅ Cluster IP port (used inside the cluster by other pods)
      targetPort: 3000  # ✅ Must match containerPort in deployment
      nodePort: 32051   # 🔹 External port for NodePort access
